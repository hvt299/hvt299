name: Update Profile & Snake Animation

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"

  # Allows manual run from Actions tab with one click
  workflow_dispatch:

  # Run on push to main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Job 1: Auto-update recent public GitHub activity in README.md
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update recent public activity
        env:
          GITHUB_USERNAME: hvt299
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit & push README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README activity is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent GitHub activity [skip ci]"
          git pull --rebase origin main
          git push origin main

  # Job 2: Generate Arsenal-themed contribution snake animation to 'output' branch
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake SVG files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=ef0107&color_dots=161b22,5c0003,8f0004,c70106,ef0107
            dist/github-snake-dark.svg?color_snake=ef0107&color_dots=161b22,5c0003,8f0004,c70106,ef0107

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
