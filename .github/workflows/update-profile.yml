name: Update Profile Activity

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"

  # Allows manual run from Actions tab with one click
  workflow_dispatch:

  # Run on push to main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Auto-update recent public GitHub activity in README.md
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update recent public activity
        env:
          GITHUB_USERNAME: hvt299
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit & push README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README activity is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update recent GitHub activity [skip ci]"
          git pull --rebase origin main
          git push origin main
